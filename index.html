<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>板材倉儲紀錄-手機版</title>
    <!-- 引入 Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; margin: 0; padding: 12px; color: #1c1c1e; }
        .container { max-width: 100%; background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2 { text-align: center; color: #1c1c1e; font-size: 20px; margin: 10px 0 20px 0; }
        .section-title { font-weight: bold; color: #007aff; border-left: 4px solid #007aff; padding-left: 8px; margin-top: 22px; margin-bottom: 12px; font-size: 16px; }
        .form-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #f8f8fa; padding: 10px 12px; border-radius: 8px; }
        label { font-weight: 600; font-size: 15px; flex: 1; }
        input[type="number"], input[type="date"], select { width: 110px; padding: 8px; border: 1px solid #d1d1d6; border-radius: 6px; text-align: center; font-size: 16px; background: white; -webkit-appearance: none; box-sizing: border-box; }
        input[readonly] { background-color: #e5e5ea; color: #3a3a3c; border-color: #d1d1d6; cursor: not-allowed; }
        
        /* 編輯狀態提示條 */
        #edit_notice { display: none; background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; border: 1px solid #ffeeba; }
        #edit_notice a { color: #533f03; font-weight: bold; text-decoration: underline; cursor: pointer; margin-left: 8px; }

        .btn-submit { display: block; width: 100%; padding: 14px; background-color: #34c759; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; margin-bottom: 10px; }
        .btn-submit:hover { background-color: #28a745; }
        .btn-export { display: block; width: 100%; padding: 12px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 25px; }
        .btn-export:hover { background-color: #0056b3; }
        .highlight { font-weight: bold; color: #ff3b30; }
        .chart-container { background: white; padding: 12px; border-radius: 8px; border: 1px solid #d1d1d6; margin-top: 10px; position: relative; height: 280px; }
        .table-container { overflow-x: auto; margin-top: 10px; border-radius: 8px; border: 1px solid #d1d1d6; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; min-width: 700px; }
        th, td { padding: 12px 6px; text-align: center; border-bottom: 1px solid #e5e5ea; }
        th { background-color: #1c1c1e; color: white; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .btn-action-group { display: flex; gap: 4px; justify-content: center; }
        .btn-edit { background-color: #007aff; color: white; border: none; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-delete { background-color: #ff3b30; color: white; border: none; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-view { background-color: #ff9500; color: white; border: none; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .no-data { text-align: center; color: #8e8e93; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 板材倉儲紀錄 (手機優化版)</h2>
    
    <!-- 正在修改的提示橫幅 -->
    <div id="edit_notice">
        ⚠️ 目前正在修改 <span id="editing_date_text"></span> 的紀錄
        <a onclick="cancelEdit()">[點此取消]</a>
    </div>

    <div class="section-title">📅 填表日期</div>
    <div class="form-group" style="background: none; padding: 0;">
        <input type="date" id="log_date" style="width: 100%; height: 44px; text-align: left; padding-left: 12px;" onchange="handleDateChange()">
    </div>

    <div class="section-title">1. 訂單與單據追蹤</div>
    <div class="form-group">
        <label>昨日未完成剩單：</label>
        <input type="number" id="prev_remains" value="0" min="0" inputmode="numeric">
    </div>
    <div class="form-group">
        <label>今日新給單數：</label>
        <input type="number" id="today_given" value="0" min="0" inputmode="numeric">
    </div>
    <div class="form-group" style="background: #e5e5ea;">
        <label>今日應完成總計：</label>
        <input type="number" id="total_expected" value="0" readonly>
    </div>
    <div class="form-group">
        <label>今日實際完成單：</label>
        <input type="number" id="today_done" value="0" min="0" inputmode="numeric">
    </div>
    <div class="form-group">
        <label class="highlight">今日未完成剩單：</label>
        <input type="number" id="today_remains" value="0" class="highlight" readonly>
    </div>
    <div class="form-group">
        <label style="color: #34c759;">今日訂單消化率：</label>
        <input type="text" id="digestion_rate" value="0%" style="color: #34c759; font-weight: bold; background: none; border: none; width: 80px;" readonly>
    </div>
    <div class="form-group" style="border: 1px solid #ff9500; background: #fff9f0;">
        <label style="color: #ff9500;">🚨 現備急件次數：</label>
        <input type="number" id="rush_orders" value="0" min="0" inputmode="numeric">
    </div>

    <div class="section-title">2. 物流量能與設備點檢</div>
    <div class="form-group">
        <label>今日進板車次 (趟)：</label>
        <input type="number" id="incoming_trucks" value="0" min="0" inputmode="numeric">
    </div>
    <div class="form-group">
        <label>廢料板車次 (趟)：</label>
        <input type="number" id="waste_trucks" value="0" min="0" inputmode="numeric">
    </div>
    <div class="form-group">
        <label>⛽ 堆高機油量點檢：</label>
        <select id="forklift_fuel" style="width: 130px;">
            <option value="滿油(100%)">滿油 (100%)</option>
            <option value="充足(75%)">充足 (75%)</option>
            <option value="半油(50%)">半油 (50%)</option>
            <option value="偏低(25%)">偏低 (25%) ⚠️</option>
            <option value="需加油">請立即加油 ❌</option>
        </select>
    </div>

    <!-- 影響瓶頸原因勾選區 -->
    <div class="section-title">⚠️ 今日影響與瓶頸原因 (可複選)</div>
    <div class="form-group" style="background: #fff9f0; border: 1px solid #ff9500; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px;">
        <label style="font-weight: normal; font-size: 14px; flex: 1 1 40%; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" name="bottleneck" value="單給太晚" style="width: 18px; height: 18px;"> 單給太晚
        </label>
        <label style="font-weight: normal; font-size: 14px; flex: 1 1 40%; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" name="bottleneck" value="缺料" style="width: 18px; height: 18px;"> 缺料
        </label>
        <label style="font-weight: normal; font-size: 14px; flex: 1 1 40%; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" name="bottleneck" value="人手不足" style="width: 18px; height: 18px;"> 人手不足
        </label>
        <label style="font-weight: normal; font-size: 14px; flex: 1 1 40%; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" name="bottleneck" value="進板車太多" style="width: 18px; height: 18px;"> 進板車太多
        </label>
    </div>

    <button class="btn-submit" id="btn_save">💾 儲存今日紀錄</button>
    <button class="btn-export" id="btn_export">📥 匯出 Excel (CSV 報表)</button>

    <div class="section-title">📈 歷史數據趨勢圖</div>
    <div class="chart-container">
        <canvas id="efficiencyChart"></canvas>
    </div>

    <div class="section-title">📋 歷史效率紀錄 (橫滑檢視)</div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>昨日剩</th>
                    <th>新給單</th>
                    <th>已完成</th>
                    <th>未完剩</th>
                    <th>消化率</th>
                    <th>急件</th>
                    <th>車次</th>
                    <th>油量</th>
                    <th>瓶頸</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="history_tbody">
            </tbody>
        </table>
    </div>
</div>

<script>
let myChart = null;

document.addEventListener('DOMContentLoaded', () => {
    resetToToday();

    ['prev_remains', 'today_given', 'today_done'].forEach(id => {
        document.getElementById(id).addEventListener('input', calculateEfficiency);
    });

    calculateEfficiency();
    renderHistoryTable();
    renderChart();

    document.getElementById('btn_save').addEventListener('click', saveData);
    document.getElementById('btn_export').addEventListener('click', exportToCSV);
});

// 取得今天日期的字串 (YYYY-MM-DD)
function getTodayDateString() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

// 重設為今天，並進行智慧帶入
function resetToToday() {
    const todayStr = getTodayDateString();
    document.getElementById('log_date').value = todayStr;
    document.getElementById('log_date').disabled = false;

    // 隱藏編輯提示
    document.getElementById('edit_notice').style.display = 'none';
    
    // 清空瓶頸勾選
    document.querySelectorAll('input[name="bottleneck"]').forEach(cb => cb.checked = false);

    // 智慧判斷：檢查「今天」是否已經有填過紀錄
    const history = getStorageData();
    const todayRecord = history.find(item => item.date === todayStr);

    if (todayRecord) {
        // 如果今天已經填過了，直接把今天的紀錄帶進來（方便續寫或查看）
        fillFormWithRecord(todayRecord);
    } else {
        // 如果今天還沒填過，才去智慧抓取「上一筆紀錄的未完成剩單」作為昨日剩單
        loadSmartPrevRemains();
        // 清空其他欄位讓使用者填寫全新一天
        document.getElementById('today_given').value = 0;
        document.getElementById('today_done').value = 0;
        document.getElementById('rush_orders').value = 0;
        document.getElementById('incoming_trucks').value = 0;
        document.getElementById('waste_trucks').value = 0;
    }

    calculateEfficiency();
}

// 智慧抓取上一筆剩單
function loadSmartPrevRemains() {
    const history = getStorageData();
    if (history.length > 0) {
        history.sort((a, b) => new Date(a.date) - new Date(b.date));
        document.getElementById('prev_remains').value = history[history.length - 1].todayRemains;
    } else {
        document.getElementById('prev_remains').value = 0;
    }
}

// 當使用者手動切換日期時的智慧反應
function handleDateChange() {
    const selectedDate = document.getElementById('log_date').value;
    const history = getStorageData();
    const existing = history.find(item => item.date === selectedDate);

    if (existing) {
        // 如果切到的日期剛好有舊紀錄，自動幫你帶入該日資料（兼具修改效果）
        fillFormWithRecord(existing);
        document.getElementById('editing_date_text').innerText = selectedDate;
        document.getElementById('edit_notice').style.display = 'block';
    } else {
        // 如果切到全新日期，隱藏編輯提示
        document.getElementById('edit_notice').style.display = 'none';
        document.querySelectorAll('input[name="bottleneck"]').forEach(cb => cb.checked = false);
    }
}

// 將紀錄填入表單
function fillFormWithRecord(record) {
    document.getElementById('prev_remains').value = record.prevRemains;
    document.getElementById('today_given').value = record.todayGiven;
    document.getElementById('today_done').value = record.todayDone;
    document.getElementById('rush_orders').value = record.rushOrders;
    document.getElementById('incoming_trucks').value = record.incomingTrucks;
    document.getElementById('waste_trucks').value = record.wasteTrucks;
    document.getElementById('forklift_fuel').value = record.forkliftFuel;

    document.querySelectorAll('input[name="bottleneck"]').forEach(cb => {
        cb.checked = record.bottlenecks && record.bottlenecks.includes(cb.value);
    });

    calculateEfficiency();
}

function calculateEfficiency() {
    const prevRemains = parseInt(document.getElementById('prev_remains').value) || 0;
    const todayGiven = parseInt(document.getElementById('today_given').value) || 0;
    const todayDone = parseInt(document.getElementById('today_done').value) || 0;

    const totalExpected = prevRemains + todayGiven;
    document.getElementById('total_expected').value = totalExpected;

    let todayRemains = totalExpected - todayDone;
    if (todayRemains < 0) todayRemains = 0; 
    document.getElementById('today_remains').value = todayRemains;

    let rate = 0;
    if (totalExpected > 0) {
        rate = Math.round((todayDone / totalExpected) * 100);
    }
    document.getElementById('digestion_rate').value = `${rate}%`;
}

function getStorageData() {
    try {
        return JSON.parse(localStorage.getItem('warehouse_logs')) || [];
    } catch (e) {
        return [];
    }
}

function saveData() {
    const date = document.getElementById('log_date').value;
    if (!date) {
        alert("請選擇填表日期！");
        return;
    }

    const selectedBottlenecks = [];
    document.querySelectorAll('input[name="bottleneck"]:checked').forEach(cb => {
        selectedBottlenecks.push(cb.value);
    });

    const record = {
        date,
        prevRemains: parseInt(document.getElementById('prev_remains').value) || 0,
        todayGiven: parseInt(document.getElementById('today_given').value) || 0,
        totalExpected: parseInt(document.getElementById('total_expected').value) || 0,
        todayDone: parseInt(document.getElementById('today_done').value) || 0,
        todayRemains: parseInt(document.getElementById('today_remains').value) || 0,
        digestionRate: document.getElementById('digestion_rate').value,
        rushOrders: parseInt(document.getElementById('rush_orders').value) || 0,
        incomingTrucks: parseInt(document.getElementById('incoming_trucks').value) || 0,
        wasteTrucks: parseInt(document.getElementById('waste_trucks').value) || 0,
        forkliftFuel: document.getElementById('forklift_fuel').value,
        bottlenecks: selectedBottlenecks
    };

    let history = getStorageData();
    
    const existingIndex = history.findIndex(item => item.date === date);
    if (existingIndex !== -1) {
        history[existingIndex] = record;
    } else {
        history.push(record);
    }

    localStorage.setItem('warehouse_logs', JSON.stringify(history));
    alert("儲存成功！");
    
    resetToToday();
    renderHistoryTable();
    renderChart();
}

// 渲染歷史紀錄清單表格
function renderHistoryTable() {
    const history = getStorageData();
    const tbody = document.getElementById('history_tbody');
    tbody.innerHTML = "";

    if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="no-data">目前尚無歷史紀錄</td></tr>`;
        return;
    }

    history.sort((a, b) => new Date(b.date) - new Date(a.date));

    history.forEach(item => {
        const tr = document.createElement('tr');
        
        let bottleneckHTML = '<span style="color: #8e8e93;">無</span>';
        if (item.bottlenecks && item.bottlenecks.length > 0) {
            const bStr = JSON.stringify(item.bottlenecks).replace(/"/g, '&quot;');
            bottleneckHTML = `<button class="btn-view" onclick='showBottlenecks("${item.date}", ${bStr})'>查看(${item.bottlenecks.length})</button>`;
        }

        tr.innerHTML = `
            <td style="font-weight:bold;">${item.date}</td>
            <td>${item.prevRemains}</td>
            <td>${item.todayGiven}</td>
            <td>${item.todayDone}</td>
            <td class="highlight">${item.todayRemains}</td>
            <td style="color:#34c759; font-weight:bold;">${item.digestionRate}</td>
            <td style="color:#ff9500; font-weight:bold;">${item.rushOrders}</td>
            <td>${item.incomingTrucks}/${item.wasteTrucks}</td>
            <td>${item.forkliftFuel}</td>
            <td>${bottleneckHTML}</td>
            <td>
                <div class="btn-action-group">
                    <button class="btn-edit" onclick="editRecord('${item.date}')">修改</button>
                    <button class="btn-delete" onclick="deleteRecord('${item.date}')">刪除</button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// 點擊修改
function editRecord(date) {
    document.getElementById('log_date').value = date;
    handleDateChange();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 取消修改
function cancelEdit() {
    resetToToday();
}

function showBottlenecks(date, bottlenecks) {
    alert(`📅 ${date} 記錄的影響瓶頸原因：\n\n・ ` + bottlenecks.join('\n・ '));
}

function deleteRecord(date) {
    if (confirm(`確定要刪除 ${date} 的這筆紀錄嗎？`)) {
        let history = getStorageData();
        history = history.filter(item => item.date !== date);
        localStorage.setItem('warehouse_logs', JSON.stringify(history));
        resetToToday();
        renderHistoryTable();
        renderChart();
    }
}

function exportToCSV() {
    const history = getStorageData();
    if (history.length === 0) {
        alert("目前沒有歷史紀錄可以匯出！");
        return;
    }

    history.sort((a, b) => new Date(a.date) - new Date(b.date));

    let csvContent = "\uFEFF日期,昨日剩單,今日新給單,應完成總計,實際完成,未完成剩單,消化率,急件次數,進板車次,廢料車次,堆高機油量,影響瓶頸原因\n";

    history.forEach(item => {
        const bottlenecksStr = (item.bottlenecks && item.bottlenecks.length > 0) ? item.bottlenecks.join(';') : '無';
        const row = [
            item.date, item.prevRemains, item.todayGiven, item.totalExpected,
            item.todayDone, item.todayRemains, item.digestionRate, item.rushOrders,
            item.incomingTrucks, item.wasteTrucks, item.forkliftFuel, `"${bottlenecksStr}"`
        ];
        csvContent += row.join(",") + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `板材倉儲紀錄_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function renderChart() {
    const history = getStorageData();
    const ctx = document.getElementById('efficiencyChart').getContext('2d');

    history.sort((a, b) => new Date(a.date) - new Date(b.date));

    const labels = history.map(item => item.date);
    const expectedData = history.map(item => item.totalExpected);
    const doneData = history.map(item => item.todayDone);
    const remainsData = history.map(item => item.todayRemains);

    if (myChart) {
        myChart.destroy();
    }

    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: '應完成總計', data: expectedData, borderColor: '#007aff', backgroundColor: '#007aff', tension: 0.1 },
                { label: '實際完成', data: doneData, borderColor: '#34c759', backgroundColor: '#34c759', tension: 0.1 },
                { label: '未完成剩單', data: remainsData, borderColor: '#ff3b30', backgroundColor: '#ff3b30', tension: 0.1 }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } }
        }
    });
}
</script>

</body>
</html>
